[project]
name = "sshuptime"
version = "0.1.0"
description = "Async terminal infrastructure dashboard with an SSH gateway"
readme = "README.md"
authors = [
    { name = "Erfan", email = "erfan.ehsany@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncssh>=2.24.0",
    "docker>=7.2.0",
    "kubernetes-asyncio>=36.1.0",
    "podman>=5.8.0",
    "psutil>=7.2.2",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
]

[project.scripts]
sshuptime = "sshuptime:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "detect-secrets>=1.5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "ty>=0.0.78",
]
